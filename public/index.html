<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recallio</title>
  <link rel="stylesheet" href="/retro.css">
  <script type="module" src="/chat.js"></script>
</head>
<body>
  <header class="topbar">
    <h1><span class="brand-mark" aria-hidden="true"></span>Recallio</h1>
    <div class="chat-controls">
      <select aria-label="Conversation"></select>
      <button id="new" type="button"><span aria-hidden="true">+</span> New chat</button>
    </div>
  </header>
  <main>
    <div class="chat-space">
      <section id="welcome" aria-labelledby="welcome-title">
        <div class="art"><img src="/terminal.png" width="280" height="280" alt=""></div>
        <h2 id="welcome-title">What changed?</h2>
        <p>Pick up an earlier conversation and check what’s changed on the web.</p>
        <div class="suggestions" aria-label="Suggested questions">
          <button type="button" data-prompt="Has pricing changed for any of the products we discussed?">Check pricing changes</button>
          <button type="button" data-prompt="What did we discuss in my previous chat, and is your answer still correct today?">Verify an earlier answer</button>
          <button type="button" data-prompt="Has any vendor on our shortlist changed pricing or shipped a major release?">Review a vendor shortlist</button>
        </div>
      </section>
      <section id="messages" aria-label="Messages" aria-live="polite" hidden></section>
    </div>
    <div class="composer">
      <p id="status" role="status"></p>
      <form>
        <label class="visually-hidden" for="message">Message</label>
        <textarea id="message" placeholder="Type a message..." rows="2" required maxlength="3000"></textarea>
        <button type="submit">Send</button>
      </form>
    </div>
  </main>
</body>
</html>
